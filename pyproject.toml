[project]
name = "masters-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joao Victor", email = "joao.victor@delfosim.com" }
]
requires-python = ">=3.14"
dependencies = [
    "h5netcdf>=1.8.1",
    "h5py>=3.15.1",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pandera[pandas]>=0.34.1",
    "pydantic>=2.14.1",
    "s3fs>=2026.2.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
    "xarray>=2026.2.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["masters_project"]

[tool.coverage.report]
show_missing = true
# Line coverage was 99% when this floor was set; the guard is there to catch a regression.
fail_under = 90
exclude_also = ['if __name__ == "__main__":']
